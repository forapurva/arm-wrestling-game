<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arm Wrestling Local Duel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="setup-screen" class="screen">
        <h1>Arm Wrestling Challenge</h1>
        <p>Two players on one screen! Get ready to mash!</p>
        <button id="btn-create">START GAME</button>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="arena">
            <!-- Player 1 Side (Left/Top Tap) -->
            <div class="character left-player">
                <div class="photo-slot" id="p1-photo" style="background-image: url('p1.jpg')">P1</div>
                <button id="btn-p1-mash" class="mash-btn">TAP!</button>
            </div>

            <!-- Wrestling Arena Track -->
            <div class="table-area">
                <div class="arm-track">
                    <div id="arm-marker">💪</div>
                </div>
            </div>

            <!-- Player 2 Side (Right/Bottom Tap) -->
            <div class="character right-player">
                <div class="photo-slot" id="p2-photo" style="background-image: url('p2.jpg')">P2</div>
                <button id="btn-p2-mash" class="mash-btn">TAP!</button>
            </div>
        </div>
    </div>

    <div id="ending-screen" class="screen hidden">
        <h1 id="match-result">Match Over!</h1>
        <div class="punishment-scene">
            <h2>Punishment Time!</h2>
            <p>No matter who lost, you must make out! 😘</p>
            <div class="kiss-visual">👩‍❤️‍💋‍👨</div>
        </div>
        <button id="btn-restart" onclick="location.reload()">Play Again</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
