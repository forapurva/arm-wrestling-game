<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Arm Wrestling Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Arm Wrestling Challenge</h1>
        
        <!-- Menu Screen -->
        <div id="menu-screen" class="screen">
            <p>Battle players live across the internet!</p>
            <button id="create-btn">Create Match</button>
            <div class="join-container">
                <input type="text" id="match-input" placeholder="Enter Match ID">
                <button id="join-btn">Join Match</button>
            </div>
        </div>

        <!-- Gameplay Screen -->
        <div id="game-screen" class="screen hidden">
            <div class="match-info">
                <p>Match ID: <span id="display-match-id"></span></p>
                <p id="status-text">Waiting for opponent...</p>
            </div>
            
            <!-- Simple Visual Arm Arena -->
            <div class="arena">
                <div class="player-side left">Player 1</div>
                <div id="arm-indicator">|</div>
                <div class="player-side right">Player 2</div>
            </div>

            <button id="mash-btn" disabled>MASH HERE!</button>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
